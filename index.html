<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini Minecraft 2D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#78c8ff;font-family:Arial;touch-action:none}canvas{display:block;width:100vw;height:100vh}#m{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#8fd3ff}#p{background:#222;color:#fff;padding:25px;border-radius:18px;text-align:center}button{font-size:22px;padding:14px 24px;border:0;border-radius:12px;background:#35a853;color:#fff;font-weight:bold}.c{position:fixed;bottom:20px;width:62px;height:62px;border-radius:50%;background:#0009;color:#fff;display:none;align-items:center;justify-content:center;font-size:26px}.l{left:15px}.r{left:90px}.j{right:15px}.b{right:90px;font-size:13px}.hot{position:fixed;top:10px;left:10px;background:#0009;color:#fff;padding:9px;border-radius:8px;display:none}</style></head><body><canvas id="g"></canvas><div id="m"><div id="p"><h1>Mini Minecraft 2D</h1><p>Ande, pule e quebre blocos.</p><button id="play">JOGAR</button></div></div><div id="hot" class="hot">Bloco: terra</div><div id="l" class="c l">◀</div><div id="r" class="c r">▶</div><div id="j" class="c j">⬆</div><div id="b" class="c b">QUEBRAR</div><script>const c=document.getElementById('g'),x=c.getContext('2d');let W,H,run=0,L=0,R=0;function z(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=z;z();let p={x:80,y:40,vx:0,vy:0,w:24,h:38,g:0};const S=32,C=80,rows=35,a=Array.from({length:rows},()=>Array(C).fill(0));for(let i=0;i<C;i++){let h=20+Math.floor(Math.sin(i*.25)*3);for(let j=h;j<rows;j++)a[j][i]=j==h?1:2}function solid(px,py,w,h){let l=Math.floor(px/S),r=Math.floor((px+w-1)/S),t=Math.floor(py/S),b=Math.floor((py+h-1)/S);for(let yy=t;yy<=b;yy++)for(let xx=l;xx<=r;xx++)if(yy>=rows||xx<0||xx>=C||yy>=0&&a[yy][xx])return 1;return 0}function step(){if(!run)return;let dt=.016;p.vx=L?-150:R?150:p.vx*.7;p.vy+=850*dt;let nx=p.x+p.vx*dt;if(!solid(nx,p.y,p.w,p.h))p.x=nx;let ny=p.y+p.vy*dt;p.g=0;if(!solid(p.x,ny,p.w,p.h))p.y=ny;else{if(p.vy>0)p.g=1;p.vy=0}let cam=Math.max(0,p.x-W/2);x.fillStyle='#79c8ff';x.fillRect(0,0,W,H);for(let yy=0;yy<rows;yy++)for(let xx=0;xx<C;xx++)if(a[yy][xx]){x.fillStyle=a[yy][xx]==1?'#43b047':'#8b5a2b';x.fillRect(xx*S-cam,yy*S,S,S);x.strokeRect(xx*S-cam,yy*S,S,S)}x.fillStyle='#245dde';x.fillRect(p.x-cam,p.y,p.w,p.h);requestAnimationFrame(step)}function jump(){if(p.g)p.vy=-380}function br(){let tx=Math.floor((p.x+(p.vx>=0?50:-20))/S),ty=Math.floor((p.y+20)/S);if(tx>=0&&tx<C&&ty>=0&&ty<rows)a[ty][tx]=0}function hold(id,set){let e=document.getElementById(id);e.onpointerdown=q=>{q.preventDefault();set(1)};e.onpointerup=e.onpointercancel=q=>set(0)}hold('l',v=>L=v);hold('r',v=>R=v);j.onpointerdown=e=>{e.preventDefault();jump()};b.onpointerdown=e=>{e.preventDefault();br()};play.onclick=()=>{m.style.display='none';hot.style.display='block';document.querySelectorAll('.c').forEach(e=>e.style.display='flex');run=1;step()};</script></body></html>
